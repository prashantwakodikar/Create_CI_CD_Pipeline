# This is a basic workflow to help you get started with Actions

name: Angular CI/CD workflow or pipeline

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop"  ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-ci-cd-pipeline
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps: 
      # Step 1: Download the repository code onto the runner
      - name: Checkout source code
        uses: actions/checkout@v4
      
      # Step 2: Set up Node.js with caching enabled
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 24
          cache: 'npm'
          cache-dependency-path: create-ci-cd-pipeline/package-lock.json
      # Step 3: Install all dependencies exactly as defined in package-lock.json
      - name: Install dependencies
        run: npm ci
        
      # Step 4: Execute unit tests in Headless Chrome
      - name: Validate Unit tests
        run: npm run test

      # Step 5: Compile the production-ready static assets
      - name: Build Application
        run: npm run build --configuration=production

      # Step6: Upload the build artifacts  
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-folder
          path: create-ci-cd-pipeline/dist/create-ci-cd-pipeline
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-folder
          path: dist/create-ci-cd-pipeline

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g angular-cli-ghpages
          git config --global user.email "prashantwakodikar@users.noreply.github.com"
          git config --global user.name "prashantwakodikar"
          npx angular-cli-ghpages --dir=dist/create-ci-cd-pipeline --branch=gh-pages

      
      - name: Verify Deployment
        run: curl -I https://prashantwakodikar.github.io/Create_CI_CD_Pipeline/
